[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakerlock"
version = "0.1.0"
description = "Speaker-locked audio middleware: real-time target-speaker extraction + verification gate in front of any STT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "huggingface_hub>=0.21",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4.6"]
whisper = ["faster-whisper>=1.0"]
deepgram = ["websockets>=12"]
pipecat = ["pipecat-ai>=1.0"]
export = ["torch>=2.2", "onnx>=1.15", "resemblyzer>=0.1.3", "librosa>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
speakerlock = "speakerlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speakerlock = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
